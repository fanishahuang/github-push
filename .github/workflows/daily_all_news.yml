name: Push All Platforms News Daily

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间早上 8 点定时运行（UTC 0点）
  workflow_dispatch: # 支持在 GitHub 网页端手动点击触发

jobs:
  run-all-news-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openai feedparser

      - name: Run fetch_all_news.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          python fetch_all_news.py
