name: Push All Platforms News Daily

on:
  schedule:
    - cron: '0 12 * * *' # 设置为每天中午 12 点运行（可根据需要修改）
  workflow_dispatch: # 支持在 GitHub 网页端随时手动触发测试

jobs:
  run-all-news-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser openai

      - name: Run fetch_all_news.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          python fetch_all_news.py
