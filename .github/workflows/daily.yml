name: Push Tech Trending Daily

on:
  schedule:
    - cron: '0 8 * * *' # 每天早上 8 点定时运行（可根据需要调整）
  workflow_dispatch: # 支持在 GitHub 网页端手动点击触发

jobs:
  run-daily-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 # 如果您的脚本用到了其他第三方库（如 beautifulsoup4 等），请在这里一并安装

      - name: Run push_trending.py
        env:
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          python push_trending.py
